<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中止食品有限公司 | 探索极致风味</title>
    <style>
        :root { --bg: #ffffff; --surface: #f9f9f9; --primary: #d90429; --text: #111111; --text-muted: #555555; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.8; }
        
        nav { position: fixed; width: 100%; top: 0; padding: 20px 10%; display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid #eeeeee; }
        .logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; color: var(--text); }
        .logo span { color: var(--primary); }
        .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 30px; font-size: 0.95rem; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary); }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; background: var(--surface); }
        .hero h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900; letter-spacing: 1px; line-height: 1.2; margin-bottom: 20px; color: var(--text); }
        .hero p { color: var(--text-muted); font-size: 1.2rem; max-width: 650px; margin-bottom: 40px; }
        .btn { padding: 16px 48px; border-radius: 50px; text-decoration: none; font-weight: 600; letter-spacing: 1px; transition: 0.3s; background: var(--text); color: #fff; }
        .btn:hover { background: var(--primary); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(217, 4, 41, 0.2); }

        .philosophy { padding: 120px 10%; text-align: center; background: var(--bg); }
        .philosophy h2 { font-size: 2rem; margin-bottom: 30px; font-weight: 800; }
        .philosophy p { color: var(--text-muted); max-width: 800px; margin: 0 auto; font-size: 1.1rem; }

        .warning-banner { background: #fff3f3; color: var(--primary); text-align: center; padding: 15px; font-weight: bold; border-top: 1px solid #ffcccc; border-bottom: 1px solid #ffcccc; letter-spacing: 1px; }

        footer { text-align: center; padding: 50px; color: #999; font-size: 0.9rem; border-top: 1px solid #eeeeee; background: var(--surface); }
    </style>
</head>
<body>
    <nav>
        <div class="logo">中止食品 <span>ZHONGZHI</span></div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="products.html">产品库</a>
            <a href="about.html">关于我们</a>
            <a href="discuss.html">讨论区</a>
        </div>
    </nav>

    <header class="hero">
        <h1>探索人类味觉的<br>最后一片荒原</h1>
        <p>自 2022 年创立以来，中止食品始终致力于打破常规。我们在深渊边缘采集原料，为您带来跨越现实边界的猎奇体验。</p>
        <a href="products.html" class="btn">进入深渊：嘎飞系列</a>
    </header>

    <div class="warning-banner">
        ⚠️ 严正声明：本网站产品皆为虚构，现实中绝对不可食用。若因好奇尝试，本公司概不负责。
    </div>

    <section class="philosophy">
        <h2>我们的理念</h2>
        <p>在浮躁的现代生活中，我们坚持最原始的粗粝工艺。每一份“嘎飞”产品的封存，都是一次对常识的挑衅。当您撕开包装的瞬间，请做好直面未知风味的心理准备。</p>
    </section>

    <footer>
        &copy; 2022 - 2026 中止食品有限公司. 保留所有权利。<br>
        产品研发：Dibajiaba | 首席股东：烟火夏天
    </footer>
</body>
</html>
